#_preseed_V1
# Minimal wired/headless profile. Accounts, passwords, partitioning and boot-disk
# selection remain interactive. Never add partman confirmations or disk selectors.
d-i debian-installer/locale string en_GB.UTF-8
d-i keyboard-configuration/xkb-keymap select gb
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string microserver
d-i clock-setup/utc boolean true
d-i time/zone string Europe/London
d-i clock-setup/ntp boolean true
d-i passwd/root-login boolean false
d-i hw-detect/load_firmware boolean true
d-i base-installer/install-recommends boolean false
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean false
d-i apt-setup/services-select multiselect security, updates
d-i mirror/suite string trixie
d-i mirror/udeb/suite string trixie
tasksel tasksel/first multiselect
d-i pkgsel/include string openssh-server sudo python3 python3-apt ca-certificates amd64-microcode firmware-misc-nonfree apparmor
d-i pkgsel/upgrade select safe-upgrade
popularity-contest popularity-contest/participate boolean false
d-i preseed/late_command string sh /cdrom/microserver/installer/media/finish.sh
