name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_media:
        description: Build and inspect the pinned real Debian installer ISO
        type: boolean
        default: false
permissions: {contents: read}
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.17'}
      - name: Prepare private validation tools
        run: |
          python -m venv "$RUNNER_TEMP/microserver-validation"
          "$RUNNER_TEMP/microserver-validation/bin/python" -m pip --isolated install --require-hashes --only-binary=:all: -r tests/requirements.lock
          bash tests/prepare-tools.sh "$RUNNER_TEMP/microserver-tools"
          echo "$RUNNER_TEMP/microserver-validation/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/microserver-tools/bin" >> "$GITHUB_PATH"
          echo "MICROSERVER_PYTHON=$RUNNER_TEMP/microserver-validation/bin/python" >> "$GITHUB_ENV"
      - name: Validate source and isolated loopback fixtures
        run: make check
      - name: Build real installer media without USB access
        if: github.event_name == 'workflow_dispatch' && inputs.build_media
        run: |
          bash installer/media/media.sh fetch "$RUNNER_TEMP/debian-source"
          bash installer/media/media.sh build "$RUNNER_TEMP/debian-source" "$RUNNER_TEMP/microserver-media"
          cat "$RUNNER_TEMP/microserver-media/SHA256SUMS"
          cat "$RUNNER_TEMP/microserver-media/boot-layout.log"
