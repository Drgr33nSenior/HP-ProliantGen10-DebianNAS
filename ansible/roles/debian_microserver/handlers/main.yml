---
- name: Restart MicroServer NFS
  ansible.builtin.systemd_service:
    name: nfs-kernel-server
    state: restarted

- name: Restart MicroServer node exporter
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    state: restarted
  when: microserver_monitoring_enabled | bool

- name: Reload MicroServer monitoring
  ansible.builtin.systemd_service:
    name: microserver-monitoring
    state: reloaded
    daemon_reload: true
  when: microserver_monitoring_enabled | bool

- name: Refresh MicroServer Docker metrics
  ansible.builtin.systemd_service:
    name: microserver-docker-metrics.service
    state: restarted
    daemon_reload: true
  when: microserver_monitoring_enabled | bool
