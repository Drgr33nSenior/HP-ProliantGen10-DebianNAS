[Unit]
ConditionPathExists=
ConditionPathExists=/etc/microserver/houston-alerts.json
After=houston-dbus.service
Requires=houston-dbus.service

[Service]
ExecStart=
ExecStart=/usr/bin/python3 /usr/local/libexec/microserver-houston-webhook.py
User=microserver-alerts
Group=microserver-alerts
WorkingDirectory=/
UMask=0077
NoNewPrivileges=yes
CapabilityBoundingSet=
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
RestrictAddressFamilies=AF_INET AF_UNIX
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
TasksMax=32
MemoryMax=96M
