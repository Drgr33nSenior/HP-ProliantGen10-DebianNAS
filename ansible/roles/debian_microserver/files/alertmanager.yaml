global:
  resolve_timeout: 5m
route:
  receiver: local-only
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
# Alerts remain visible in the local UI. External notification delivery needs
# a separately reviewed owner receiver; this profile sends no messages.
receivers:
  - name: local-only
