# Local warning/critical policy for the qualified Micron DDR4 DIMMs.
# Normal operating range ends at 85 C; see docs/HOST-TOOLS.md.
# Match the adapter by name so kernel I2C bus renumbering is harmless.
bus "i2c-0" "SMBus PIIX4 adapter port 0 at 0b00"

chip "jc42-i2c-0-18" "jc42-i2c-0-1a"
    set temp1_max 75
    set temp1_crit 85
    set temp1_crit_hyst 82
