[Unit]
ConditionPathExists=
ConditionPathExists=/etc/microserver/houston-alerts.json

[Service]
Type=dbus
BusName=org._45drives.Houston
ExecStartPre=
ExecStartPre=/usr/bin/python3 /usr/local/libexec/microserver-houston-dbus.py --setup
ExecStart=
ExecStart=/usr/bin/python3 /usr/local/libexec/microserver-houston-dbus.py
UMask=0077
StandardOutput=journal
StandardError=journal
NoNewPrivileges=yes
CapabilityBoundingSet=
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
PrivateNetwork=yes
RestrictAddressFamilies=AF_UNIX
ReadWritePaths=/var/lib/sqlite/45drives
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
TasksMax=32
MemoryMax=128M
