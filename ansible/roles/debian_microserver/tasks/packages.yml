---
- name: Keep iperf3 as an on-demand diagnostic tool
  ansible.builtin.debconf:
    name: iperf3
    question: iperf3/start_daemon
    value: 'false'
    vtype: boolean

- name: Install Debian storage and monitoring packages from configured signed repositories
  ansible.builtin.apt:
    name:
      - linux-headers-amd64
      - 'linux-headers-{{ ansible_facts.kernel }}'
      - zfs-dkms
      - zfsutils-linux
      - nfs-kernel-server
      - smartmontools
      - ethtool
      - pciutils
      - dmidecode
      - lm-sensors
      - iperf3
      - nftables
      - systemd-timesyncd
      - irqbalance
      - linux-cpupower
      - powertop
      - tuned
      - amd64-microcode
      - firmware-misc-nonfree
      - firmware-amd-graphics
      - apparmor
      - zfs-zed
      - docker.io
      - docker-compose
      - prometheus-node-exporter
    state: present
    install_recommends: false
    update_cache: true
    cache_valid_time: 3600
    policy_rc_d: 101
  # Debian contrib must already be enabled. No third-party repository or kernel.

- name: Keep benchmark and automatic power-tuning units inactive
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    enabled: false
    state: stopped
  loop: [iperf3, powertop]
