---
- name: Install Debian storage and monitoring packages from configured signed repositories
  ansible.builtin.apt:
    name:
      - linux-headers-amd64
      - 'linux-headers-{{ ansible_facts.kernel }}'
      - zfs-dkms
      - zfsutils-linux
      - nfs-kernel-server
      - smartmontools
      - docker.io
      - docker-compose
      - prometheus-node-exporter
    state: present
    update_cache: true
    cache_valid_time: 3600
    policy_rc_d: 101
  # Debian contrib must already be enabled. No third-party repository or kernel.
