---
- name: Bootstrap Debian packages
  ansible.builtin.import_tasks: packages.yml
  tags: [never, packages]

- name: Configure the owner-selected storage pool
  ansible.builtin.import_tasks: storage.yml
  tags: [configure]

- name: Configure lightweight host services
  ansible.builtin.import_tasks: host.yml
  tags: [configure, host]

- name: Configure the qualified DIMM temperature limits
  ansible.builtin.import_tasks: sensors.yml
  when: microserver_dimm_limits_enabled | bool
  tags: [configure, host, sensors]

- name: Configure TuneD CPU performance
  ansible.builtin.import_tasks: tuning.yml
  tags: [configure, tuning]

- name: Stage and optionally start local monitoring
  ansible.builtin.import_tasks: monitoring.yml
  tags: [configure, monitoring]
