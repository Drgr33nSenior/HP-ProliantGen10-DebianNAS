---
- name: Require exact private IPv4 syslog endpoints before opening a listener
  ansible.builtin.assert:
    that:
      - item is string
      - item is match('^(10[.](?:[0-9]{1,3}[.]){2}[0-9]{1,3}|192[.]168[.][0-9]{1,3}[.][0-9]{1,3}|172[.](?:1[6-9]|2[0-9]|3[01])[.][0-9]{1,3}[.][0-9]{1,3})$')
      - item.split('.') | map('int') | max <= 255
      - item.split('.') | map('int') | join('.') == item
    fail_msg: UniFi logging requires exact private IPv4 gateway and NAS addresses; no wildcard, subnet or public endpoint.
  loop: ['{{ microserver_unifi_gateway_ip }}', '{{ microserver_unifi_syslog_listen_ip }}']
  when: microserver_unifi_syslog_enabled | bool

- name: Require the syslog bind address on this NAS
  ansible.builtin.assert:
    that:
      - microserver_unifi_syslog_listen_ip in ansible_facts.all_ipv4_addresses
      - microserver_unifi_gateway_ip != microserver_unifi_syslog_listen_ip
    fail_msg: Bind syslog to an actual NAS address and select a separate gateway sender.
  when: microserver_unifi_syslog_enabled | bool

- name: Inspect monitoring paths before creating configuration or data
  ansible.builtin.stat:
    path: '{{ item.path }}'
    follow: false
    get_checksum: false
    get_mime: false
  loop:
    - {path: /etc/microserver, uid: 0}
    - {path: /etc/microserver/monitoring, uid: 0}
    - {path: /etc/microserver/private, uid: 0}
    - {path: /etc/microserver/monitoring/provisioning, uid: 0}
    - {path: /etc/microserver/monitoring/provisioning/datasources, uid: 0}
    - {path: /etc/microserver/monitoring/provisioning/dashboards, uid: 0}
    - {path: /etc/microserver/monitoring/dashboard-folders, uid: 0}
    - {path: /etc/microserver/monitoring/dashboard-folders/Infrastructure, uid: 0}
    - {path: /etc/microserver/monitoring/dashboard-folders/Network, uid: 0}
    - {path: /var/lib/microserver, uid: 0}
    - {path: /var/lib/microserver/prometheus, uid: 65534}
    - {path: /var/lib/microserver/grafana, uid: 472}
    - {path: /var/lib/microserver/alertmanager, uid: 65534}
    - {path: /var/lib/microserver/node-exporter, uid: 0}
    - {path: /var/lib/microserver/loki, uid: 10001}
    - {path: /var/lib/microserver/vector, uid: 65534}
    - {path: /usr/local, uid: 0}
    - {path: /usr/local/libexec, uid: 0}
  register: microserver_monitoring_paths

- name: Reject symlinked or writable monitoring directories
  ansible.builtin.assert:
    that:
      - not item.stat.exists or (item.stat.isdir | default(false) and not item.stat.islnk | default(false) and item.stat.uid == item.item.uid and item.stat.mode is match('^[0-7]{2}[0145][0145]$'))
  loop: '{{ microserver_monitoring_paths.results }}'

- name: Create monitoring configuration directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /etc/microserver
    - /etc/microserver/monitoring
    - /etc/microserver/monitoring/provisioning
    - /etc/microserver/monitoring/provisioning/datasources
    - /etc/microserver/monitoring/provisioning/dashboards
    - /etc/microserver/monitoring/dashboard-folders
    - /etc/microserver/monitoring/dashboard-folders/Infrastructure
    - /etc/microserver/monitoring/dashboard-folders/Network
    - /var/lib/microserver
    - /var/lib/microserver/node-exporter
    - /usr/local/libexec

- name: Keep private credential preparation local to the owner
  ansible.builtin.file:
    path: /etc/microserver/private
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Create bounded service state directories on the OS filesystem
  ansible.builtin.file:
    path: '/var/lib/microserver/{{ item.name }}'
    state: directory
    owner: '{{ item.uid }}'
    group: '{{ item.uid }}'
    mode: '0700'
  loop:
    - {name: prometheus, uid: 65534}
    - {name: grafana, uid: 472}
    - {name: alertmanager, uid: 65534}
    - {name: loki, uid: 10001}
    - {name: vector, uid: 65534}

- name: Render local monitoring configuration
  ansible.builtin.template:
    src: '{{ item.src }}'
    dest: '/etc/microserver/monitoring/{{ item.dest }}'
    owner: root
    group: root
    mode: '0644'
  loop:
    - {src: compose.yaml.j2, dest: compose.yaml}
    - {src: prometheus.yaml.j2, dest: prometheus.yaml}
    - {src: vector.yaml.j2, dest: vector.yaml}
  notify: Reload MicroServer monitoring

- name: Install the NAS alert rules and local Alertmanager route
  ansible.builtin.copy:
    src: '{{ item }}'
    dest: '/etc/microserver/monitoring/{{ item }}'
    owner: root
    group: root
    mode: '0644'
  loop: [alerts.yaml, alertmanager.yaml, loki.yaml]
  notify: Reload MicroServer monitoring

- name: Reuse the canonical Prometheus datasource with a local address
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.file', playbook_dir + '/../observability/config/datasources.metrics.yaml') | replace('http://prometheus:9090', 'http://127.0.0.1:9090') }}\n"
    dest: /etc/microserver/monitoring/provisioning/datasources/prometheus.yaml
    owner: root
    group: root
    mode: '0644'
  notify: Reload MicroServer monitoring

- name: Reuse the canonical dashboard provider
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../observability/config/dashboards.yaml'
    dest: /etc/microserver/monitoring/provisioning/dashboards/workstation.yaml
    owner: root
    group: root
    mode: '0644'
  notify: Reload MicroServer monitoring

- name: Provision the local Loki datasource
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../observability/config/datasources.logs.yaml'
    dest: /etc/microserver/monitoring/provisioning/datasources/loki.yaml
    owner: root
    group: root
    mode: '0644'
  notify: Reload MicroServer monitoring

- name: Reuse the canonical dashboards without copying a second maintained source
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../observability/dashboards/'
    dest: /etc/microserver/monitoring/dashboard-folders/Infrastructure/
    owner: root
    group: root
    mode: '0644'
    directory_mode: '0755'
  notify: Reload MicroServer monitoring

- name: Add the NAS dashboard to the shared dashboard folder
  ansible.builtin.copy:
    src: microserver-dashboard.json
    dest: /etc/microserver/monitoring/dashboard-folders/Infrastructure/microserver.json
    owner: root
    group: root
    mode: '0644'
  notify: Reload MicroServer monitoring

- name: Add the UniFi events dashboard
  ansible.builtin.copy:
    src: unifi-logs-dashboard.json
    dest: /etc/microserver/monitoring/dashboard-folders/Network/unifi-logs.json
    owner: root
    group: root
    mode: '0644'
  notify: Reload MicroServer monitoring

- name: Add the network overview dashboard
  ansible.builtin.copy:
    src: network-dashboard.json
    dest: /etc/microserver/monitoring/dashboard-folders/Network/overview.json
    owner: root
    group: root
    mode: '0644'
  notify: Reload MicroServer monitoring

- name: Require explicit HTTPS controller settings for performance polling
  ansible.builtin.assert:
    that:
      - microserver_unifi_controller_url is string
      - microserver_unifi_controller_url is match('^https://[A-Za-z0-9](?:[A-Za-z0-9.-]{0,251}[A-Za-z0-9])?(?::443)?/?$')
      - microserver_unifi_controller_url | trim == microserver_unifi_controller_url
      - microserver_unifi_auth_method in ['api_key', 'password']
      - microserver_unifi_auth_method != 'password' or (microserver_unifi_username is string and microserver_unifi_username | length > 0)
    fail_msg: Select an owner-verified HTTPS controller URL, a local API key or read-only account, and a username for password authentication.
  when: microserver_unifi_metrics_enabled | bool

- name: Validate an optional private controller hostname alias
  ansible.builtin.assert:
    that:
      - microserver_unifi_controller_ip is string
      - microserver_unifi_controller_ip is match('^(10[.](?:[0-9]{1,3}[.]){2}[0-9]{1,3}|192[.]168[.][0-9]{1,3}[.][0-9]{1,3}|172[.](?:1[6-9]|2[0-9]|3[01])[.][0-9]{1,3}[.][0-9]{1,3})$')
      - microserver_unifi_controller_ip.split('.') | map('int') | max <= 255
      - microserver_unifi_controller_ip.split('.') | map('int') | join('.') == microserver_unifi_controller_ip
    fail_msg: An optional controller hostname alias requires an exact private IPv4 address.
  when: microserver_unifi_metrics_enabled | bool and microserver_unifi_controller_ip | length > 0

- name: Inspect only owner-prepared UniFi credential metadata
  ansible.builtin.stat:
    path: /etc/microserver/private/unifi-credential
    follow: false
    get_checksum: false
    get_mime: false
  register: microserver_unifi_credential
  when: microserver_unifi_metrics_enabled | bool

- name: Require a private UniFi credential without reading it
  ansible.builtin.assert:
    that:
      - microserver_unifi_credential.stat.exists
      - microserver_unifi_credential.stat.isreg | default(false)
      - not microserver_unifi_credential.stat.islnk | default(false)
      - microserver_unifi_credential.stat.uid == 0
      - microserver_unifi_credential.stat.gid == 65534
      - microserver_unifi_credential.stat.mode == '0440'
      - microserver_unifi_credential.stat.size > 0
    fail_msg: Prepare the UniFi credential on the NAS as documented; this play never reads it.
  when: microserver_unifi_metrics_enabled | bool

- name: Inspect only optional UniFi CA metadata
  ansible.builtin.stat:
    path: /etc/microserver/private/unifi-ca.pem
    follow: false
    get_checksum: false
    get_mime: false
  register: microserver_unifi_ca
  when: microserver_unifi_metrics_enabled | bool and microserver_unifi_custom_ca | bool

- name: Require a protected owner-verified CA file
  ansible.builtin.assert:
    that:
      - microserver_unifi_ca.stat.exists
      - microserver_unifi_ca.stat.isreg | default(false)
      - not microserver_unifi_ca.stat.islnk | default(false)
      - microserver_unifi_ca.stat.uid == 0
      - microserver_unifi_ca.stat.gid == 65534
      - microserver_unifi_ca.stat.mode == '0440'
      - microserver_unifi_ca.stat.size > 0
    fail_msg: Prepare the public CA chain locally after owner verification; TLS verification stays enabled.
  when: microserver_unifi_metrics_enabled | bool and microserver_unifi_custom_ca | bool

- name: Render the nonsecret UniFi polling configuration
  ansible.builtin.template:
    src: unpoller.conf.j2
    dest: /etc/microserver/monitoring/unpoller.conf
    owner: root
    group: root
    mode: '0644'
  when: microserver_unifi_metrics_enabled | bool
  notify: Reload MicroServer monitoring

- name: Bind the Debian node exporter to loopback
  ansible.builtin.copy:
    dest: /etc/default/prometheus-node-exporter
    content: |
      ARGS="--web.listen-address=127.0.0.1:9100 --collector.disable-defaults --collector.cpu --collector.meminfo --collector.filesystem --collector.diskstats --collector.pressure --collector.stat --collector.time --collector.uname --collector.zfs --collector.hwmon --collector.netdev --collector.netclass --collector.textfile --collector.textfile.directory=/var/lib/microserver/node-exporter"
    owner: root
    group: root
    mode: '0644'
  notify: Restart MicroServer node exporter

- name: Inspect the Docker collector program without following symlinks
  ansible.builtin.stat:
    path: /usr/local/libexec/microserver-docker-metrics.py
    follow: false
    get_checksum: false
    get_mime: false
  register: microserver_docker_program

- name: Require a protected Docker collector program path
  ansible.builtin.assert:
    that:
      - not microserver_docker_program.stat.exists or (microserver_docker_program.stat.isreg | default(false) and not microserver_docker_program.stat.islnk | default(false) and microserver_docker_program.stat.uid == 0 and microserver_docker_program.stat.mode is match('^[0-7]{2}[0145][0145]$'))
    fail_msg: Refuse an untrusted or symlinked Docker collector program.

- name: Install the bounded Docker statistics collector
  ansible.builtin.copy:
    src: microserver-docker-metrics.py
    dest: /usr/local/libexec/microserver-docker-metrics.py
    owner: root
    group: root
    mode: '0644'
  notify: Refresh MicroServer Docker metrics

- name: Install the Docker collector service and timer
  ansible.builtin.copy:
    src: '{{ item }}'
    dest: '/etc/systemd/system/{{ item }}'
    owner: root
    group: root
    mode: '0644'
  loop: [microserver-docker-metrics.service, microserver-docker-metrics.timer]
  notify: Refresh MicroServer Docker metrics

- name: Install the monitoring service
  ansible.builtin.copy:
    src: microserver-monitoring.service
    dest: /etc/systemd/system/microserver-monitoring.service
    owner: root
    group: root
    mode: '0644'
  register: microserver_monitoring_unit
  notify: Reload MicroServer monitoring

- name: Inspect only Grafana credential metadata before activation
  ansible.builtin.stat:
    path: /etc/microserver/private/grafana-admin-password
    follow: false
    get_checksum: false
    get_mime: false
  register: microserver_grafana_credential
  when: microserver_monitoring_enabled | bool

- name: Require a private owner-prepared credential without reading it
  ansible.builtin.assert:
    that:
      - microserver_grafana_credential.stat.exists
      - microserver_grafana_credential.stat.isreg | default(false)
      - not microserver_grafana_credential.stat.islnk | default(false)
      - microserver_grafana_credential.stat.uid == 0
      - microserver_grafana_credential.stat.gid == 472
      - microserver_grafana_credential.stat.mode == '0440'
      - microserver_grafana_credential.stat.size >= 16
    fail_msg: Prepare the Grafana password locally as documented; this play never generates or reads credentials.
  when: microserver_monitoring_enabled | bool

- name: Validate Compose before activation
  ansible.builtin.command:
    argv: [/usr/bin/docker-compose, --project-name, microserver, --file, /etc/microserver/monitoring/compose.yaml, config, --quiet]
  changed_when: false
  when: microserver_monitoring_enabled | bool and not ansible_check_mode

- name: Enable required monitoring services only after explicit activation
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    enabled: true
    state: started
    daemon_reload: '{{ microserver_monitoring_unit.changed }}'
  loop: [apparmor, docker, prometheus-node-exporter, microserver-monitoring]
  when: microserver_monitoring_enabled | bool

- name: Apply pending service configuration before readiness checks
  ansible.builtin.meta: flush_handlers

- name: Find only the optional collector when polling is disabled
  ansible.builtin.command:
    argv: [/usr/bin/docker, ps, --quiet, --filter, 'label=com.docker.compose.project=microserver', --filter, 'label=com.docker.compose.service=unpoller']
  register: microserver_unifi_running
  changed_when: false
  when: microserver_monitoring_enabled | bool and not microserver_unifi_metrics_enabled | bool and not ansible_check_mode

- name: Stop the optional collector after polling is disabled
  ansible.builtin.command:
    argv: [/usr/bin/docker, stop, --time, '30', '{{ item }}']
  loop: '{{ microserver_unifi_running.stdout_lines | default([]) }}'
  when: microserver_monitoring_enabled | bool and not microserver_unifi_metrics_enabled | bool and not ansible_check_mode

- name: Collect an initial Docker metrics snapshot after explicit activation
  ansible.builtin.systemd_service:
    name: microserver-docker-metrics.service
    state: started
    daemon_reload: true
  when: microserver_monitoring_enabled | bool

- name: Enable periodic Docker collection after explicit activation
  ansible.builtin.systemd_service:
    name: microserver-docker-metrics.timer
    enabled: true
    state: started
  when: microserver_monitoring_enabled | bool

- name: Check local monitoring readiness without collecting application content
  ansible.builtin.uri:
    url: '{{ item }}'
    return_content: false
    status_code: 200
    timeout: 5
  register: microserver_readiness
  until: microserver_readiness.status | default(0) == 200
  retries: 12
  delay: 5
  loop:
    - http://127.0.0.1:9090/-/ready
    - http://127.0.0.1:3000/api/health
    - http://127.0.0.1:9093/-/ready
    - http://127.0.0.1:9100/
    - http://127.0.0.1:3100/ready
    - http://127.0.0.1:8687/metrics
  when: microserver_monitoring_enabled | bool and not ansible_check_mode

- name: Require the bundled query plugin frontends after activation
  ansible.builtin.uri:
    url: 'http://127.0.0.1:3000/public/plugins/{{ item }}/module.js'
    method: HEAD
    return_content: false
    status_code: 200
    timeout: 5
  register: microserver_query_plugin
  until: microserver_query_plugin.status | default(0) == 200
  loop: [prometheus, loki]
  retries: 12
  delay: 5
  when: microserver_monitoring_enabled | bool and not ansible_check_mode

- name: Check the optional UniFi exporter endpoint
  ansible.builtin.uri:
    url: http://127.0.0.1:9130/metrics
    return_content: false
    status_code: 200
    timeout: 5
  register: microserver_unifi_readiness
  until: microserver_unifi_readiness.status | default(0) == 200
  retries: 12
  delay: 5
  when: microserver_monitoring_enabled | bool and microserver_unifi_metrics_enabled | bool and not ansible_check_mode
