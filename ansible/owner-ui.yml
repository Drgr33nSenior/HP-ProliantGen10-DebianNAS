---
# Owner-run component update. This entry point does not configure disks or NFS.
- name: Owner-run MicroServer intranet UI update
  hosts: microserver
  become: true
  gather_facts: true
  serial: 1
  pre_tasks:
    - name: Require one explicitly authorised production MicroServer
      ansible.builtin.assert:
        that:
          - microserver_environment | default('unmapped') == 'prd'
          - microserver_owner_install | default(false) | bool
          - ansible_facts.distribution == 'Debian'
          - ansible_facts.distribution_major_version == '13'
          - ansible_facts.architecture == 'x86_64'
          - ansible_play_hosts_all | length == 1
        fail_msg: The owner must run this UI-only update for one reviewed Debian 13 AMD64 MicroServer.
  tasks:
    - name: Configure only the intranet UIs
      ansible.builtin.import_role:
        name: debian_microserver
        tasks_from: ui
