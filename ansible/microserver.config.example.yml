---
# Copy outside Git. Discover the actual GUID, client addresses and numeric IDs.
microserver_pool_name: nas
microserver_pool_guid: ''
microserver_nfs_clients: []
microserver_share_uid: 0
microserver_share_gid: 0
microserver_monitoring_enabled: false
# Set false if measured IRQ placement/throughput regresses with balancing.
microserver_irqbalance_enabled: true
# Enable only for the Micron DIMM pair qualified in docs/HOST-TOOLS.md.
microserver_dimm_limits_enabled: false
# Enable only after selecting the exact gateway sender and NAS LAN address.
# UniFi sends CEF logs to UDP 1514. No listener is opened while this is false.
microserver_unifi_syslog_enabled: false
microserver_unifi_gateway_ip: ''
microserver_unifi_syslog_listen_ip: ''
