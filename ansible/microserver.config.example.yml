---
# Copy outside Git. Discover the actual GUID, client identities and numeric IDs.
microserver_pool_name: nas
microserver_pool_guid: ''
# Exact private IPv4s or FQDNs resolved and validated on the NAS during apply.
# For example: ['workstation.home.arpa']. Unresolved names block storage changes.
microserver_nfs_clients: []
microserver_share_uid: 0
microserver_share_gid: 0
microserver_monitoring_enabled: false
# Optional HTTP intranet UIs. Backends and exporters remain on loopback.
# Use a NAS private address, internal DNS suffix and exact trusted IPv4 CIDRs.
# Create grafana, prometheus and alertmanager A records in your internal DNS.
microserver_ui_enabled: false
# Commission owner-tls.yml first, then retain this flag for later applies.
microserver_ui_tls_enabled: false
# Commission owner-cockpit.yml after the owner ZFS 2.4 upgrade and reboot checks.
# Retain this flag in later UI/monitoring profiles once management is installed.
microserver_cockpit_enabled: false
microserver_cockpit_admin: ''
microserver_ui_address: ''
microserver_ui_domain: ''
microserver_ui_allowed_networks: []
# After monitoring/UI commissioning, use ansible/owner-telemetry.yml to add
# the NAS trace backend and source-restricted HTTP ingestion on TCP 8080.
microserver_telemetry_enabled: false
microserver_telemetry_client_address: ''
# After receiver qualification, owner-workstation.yml loads the NAS-scoped
# workstation alerts. Retain this flag for later full monitoring applies.
microserver_workstation_rules_enabled: false
# Set false if measured IRQ placement/throughput regresses with balancing.
microserver_irqbalance_enabled: true
# Enable only for the Micron DIMM pair qualified in docs/HOST-TOOLS.md.
microserver_dimm_limits_enabled: false
# Enable only after selecting the exact gateway sender and NAS LAN address.
# UniFi sends CEF logs to UDP 1514. No listener is opened while this is false.
microserver_unifi_syslog_enabled: false
microserver_unifi_gateway_ip: ''
microserver_unifi_syslog_listen_ip: ''
# Performance polling is separate from SIEM logs. Prepare credentials on the NAS.
microserver_unifi_metrics_enabled: false
microserver_unifi_controller_url: ''  # HTTPS URL whose certificate is trusted.
microserver_unifi_controller_ip: ''   # Optional private IPv4 alias for that hostname.
microserver_unifi_auth_method: api_key  # Or password for a local read-only account.
microserver_unifi_username: ''  # Required only with password authentication.
microserver_unifi_custom_ca: false  # Use the owner-verified unifi-ca.pem if needed.
