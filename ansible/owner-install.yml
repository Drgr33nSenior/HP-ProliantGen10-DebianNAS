---
# Full installation entry point; requires microserver_owner_install: true.
- name: Owner-run MicroServer installation
  hosts: microserver
  become: true
  gather_facts: true
  serial: 1
  pre_tasks:
    - name: Require an explicit owner-run installation
      ansible.builtin.assert:
        that:
          - microserver_owner_install | default(false) | bool
          - ansible_facts.distribution == 'Debian'
          - ansible_facts.distribution_major_version == '13'
          - ansible_facts.architecture == 'x86_64'
          - ansible_play_hosts_all | length == 1
        fail_msg: The owner must launch this entry point for exactly one reviewed Debian 13 AMD64 MicroServer.
      tags: [always]
  roles:
    - role: debian_microserver
