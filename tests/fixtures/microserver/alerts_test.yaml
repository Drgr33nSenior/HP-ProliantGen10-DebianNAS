rule_files: [alerts.yaml]
evaluation_interval: 1m
tests:
  - name: Missing exporter fires after the hold period
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 6m
        alertname: MicroServerExporterMissing
        exp_alerts:
          - exp_labels: {severity: warning, job: microserver-node}
            exp_annotations: {summary: 'MicroServer host metrics are unavailable'}
  - name: Low resources fire and then recover
    interval: 1m
    input_series:
      - series: 'up{job="microserver-node"}'
        values: '1x16'
      - series: 'node_memory_MemAvailable_bytes{job="microserver-node"}'
        values: '50x5 500x10'
      - series: 'node_memory_MemTotal_bytes{job="microserver-node"}'
        values: '1000x16'
      - series: 'node_filesystem_avail_bytes{job="microserver-node",fstype="ext4",mountpoint="/"}'
        values: '5x5 50x10'
      - series: 'node_filesystem_size_bytes{job="microserver-node",fstype="ext4",mountpoint="/"}'
        values: '100x16'
    alert_rule_test:
      - eval_time: 5m
        alertname: MicroServerMemoryLow
        exp_alerts:
          - exp_labels: {severity: warning, job: microserver-node}
            exp_annotations: {summary: 'MicroServer available memory below 10%'}
      - eval_time: 5m
        alertname: MicroServerFilesystemLow
        exp_alerts:
          - exp_labels: {severity: warning, job: microserver-node, fstype: ext4, mountpoint: /}
            exp_annotations: {summary: 'MicroServer filesystem free space below 15%'}
      - {eval_time: 12m, alertname: MicroServerMemoryLow, exp_alerts: []}
      - {eval_time: 12m, alertname: MicroServerFilesystemLow, exp_alerts: []}
      - {eval_time: 12m, alertname: MicroServerExporterMissing, exp_alerts: []}
