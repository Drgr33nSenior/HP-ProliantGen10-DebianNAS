# Adapted from the reviewed workstation rules; job selectors separate NAS data.
groups:
  - name: workstation
    interval: 30s
    rules:
      - record: workstation:memory_available_ratio
        expr: node_memory_MemAvailable_bytes{job="node"} / node_memory_MemTotal_bytes{job="node"}
      - record: workstation:memory_pressure_ratio:rate5m
        expr: rate(node_pressure_memory_waiting_seconds_total{job="node"}[5m])
      - alert: WorkstationMemoryHeadroomLow
        expr: workstation:memory_available_ratio < 0.10
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'Host available RAM below 10%; no swap baseline'
          description: 'Inspect AI/build overlap and pod memory; do not remove the host reserve.'
      - alert: WorkstationMemoryPressure
        expr: workstation:memory_pressure_ratio:rate5m > 0.1
        for: 5m
        labels: {severity: warning}
        annotations: {summary: 'Sustained host memory stalls; reduce concurrency before tuning'}
      - alert: WorkstationStorageSpaceLow
        expr: '(node_filesystem_avail_bytes{job="node",fstype="xfs"} / node_filesystem_size_bytes{job="node",fstype="xfs"}) < 0.15'
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'XFS free space below 15%'
          description: 'Review model/build/log retention. PVC requested sizes are not filesystem quotas.'
      - alert: WorkstationExporterDown
        expr: 'up{job=~"node|kube-state-metrics|alloy|alloy-ebpf|workstation-host-alloy|prometheus|loki|tempo|grafana|amd-gpu"} == 0'
        for: 5m
        labels: {severity: warning}
        annotations: {summary: 'An expected workstation telemetry target is unavailable'}
      - alert: WorkstationHostTelemetryMissing
        expr: 'absent(node_memory_MemTotal_bytes{job="node"})'
        for: 5m
        labels: {severity: warning}
        annotations: {summary: 'No host memory observations; missing data is not healthy data'}
      - alert: WorkstationPodOOM
        expr: 'kube_pod_container_status_last_terminated_reason{job="kube-state-metrics",reason="OOMKilled"} == 1'
        for: 1m
        labels: {severity: warning}
        annotations: {summary: 'A container last terminated with OOMKilled; inspect its actual memory budget'}
      - alert: WorkstationPodRestarting
        expr: 'increase(kube_pod_container_status_restarts_total{job="kube-state-metrics"}[15m]) > 2'
        for: 2m
        labels: {severity: warning}
        annotations: {summary: 'Repeated container restarts; inspect rollout and readiness evidence'}
      - alert: WorkstationTelemetryExportFailed
        expr: 'sum(increase(otelcol_exporter_send_failed_spans_total{job=~"alloy|workstation-host-alloy"}[5m])) > 0 or sum(increase(otelcol_exporter_send_failed_log_records_total{job=~"alloy|workstation-host-alloy"}[5m])) > 0 or sum(increase(otelcol_exporter_send_failed_metric_points_total{job=~"alloy|workstation-host-alloy"}[5m])) > 0 or sum(increase(prometheus_remote_storage_samples_failed_total{job=~"alloy|workstation-host-alloy"}[5m])) > 0'
        for: 2m
        labels: {severity: warning}
        annotations: {summary: 'Telemetry export failures; inspect backend readiness, limits and bounded queues'}
      - alert: WorkstationTelemetryRefused
        expr: 'sum(increase({__name__=~"otelcol_processor(_memory_limiter)?_refused_(spans|log_records|metric_points)_total",job=~"alloy|workstation-host-alloy"}[5m])) > 0'
        for: 2m
        labels: {severity: warning}
        annotations: {summary: 'Collector memory limiter refused telemetry; results may be incomplete'}
      - alert: WorkstationHostAlloyHeartbeatMissing
        expr: 'absent_over_time(up{job="workstation-host-alloy"}[5m])'
        for: 2m
        labels: {severity: warning}
        annotations: {summary: 'Host Alloy heartbeat is absent or stale; host telemetry may be incomplete'}
      - alert: WorkstationPrometheusRuleFailure
        # NAS self-observation remains available when workstation Alloy is off.
        expr: 'increase(prometheus_rule_evaluation_failures_total{job="microserver-prometheus"}[5m]) > 0'
        for: 2m
        labels: {severity: warning}
        annotations: {summary: 'Recording or alert rule evaluation failed'}
      - alert: WorkstationHardwareSampleStale
        expr: 'time() - workstation_hardware_sample_timestamp_seconds{job="node"} > 120 or absent(workstation_hardware_sample_timestamp_seconds{job="node"})'
        for: 2m
        labels: {severity: warning}
        annotations: {summary: 'Host hardware sampler is missing or stale; check its timer and textfile permissions'}
      - alert: WorkstationGPUInventoryChanged
        expr: 'max(gpu_nodes_total{job="amd-gpu"}) != 2'
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: 'Discovered GPU count differs from this dual-R9700 workstation plan'
          description: 'Reconcile physical inventory and driver state; do not infer a failed card solely from this metric. Review this rule if the intended inventory changes.'
      - alert: WorkstationGPUVRAMNearlyFull
        expr: 'max by (gpu_id) (gpu_used_vram{job="amd-gpu"}) / max by (gpu_id) (gpu_total_vram{job="amd-gpu"}) > 0.98'
        for: 5m
        labels: {severity: warning}
        annotations: {summary: 'One physical GPU has less than 2% VRAM headroom; inspect model/KV/workspace allocations'}
      - alert: WorkstationAIStackStageFailed
        expr: 'workstation_ai_stack_stage_last_result{job="node"} == 0'
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: 'The last AI-stack build of a stage failed'
          description: 'Read the stage build.log under ~/ai-stack/builds; the previous image remains the rollback.'
      - alert: WorkstationAIStackStageStuck
        expr: '(time() - workstation_ai_stack_stage_started_timestamp_seconds{job="node"} > 43200) and on(job,instance,stage) (workstation_ai_stack_stage_running{job="node"} == 1)'
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'An AI-stack build stage has run for more than 12 hours'
          description: 'Check the ai-stack-build user unit for a hang or memory thrash before restarting it.'
      - alert: WorkstationServingKVPoolSaturated
        expr: 'max by (model_name) (sglang:token_usage{job="sglang"}) > 0.95'
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'SGLang KV token pool above 95% for 10 minutes'
          description: 'Requests will be retracted or queued; lower concurrency or context, or resize the pool.'
      - alert: WorkstationServingRetracting
        expr: 'sum by (model_name) (increase(sglang:num_retracted_requests_total{job="sglang"}[10m])) > 0'
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'SGLang is retracting requests because the KV pool ran out'
          description: 'Retractions add latency and repeat prefill; compare with KV pool usage and admission limits.'
      - alert: WorkstationServingSpeculativeAcceptanceLow
        expr: '(min by (model_name) (sglang:spec_accept_length{job="sglang"}) < 2) and on(model_name) (sum by (model_name) (rate(sglang:generation_tokens_total{job="sglang"}[10m])) > 0)'
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'Speculative decoding accepts fewer than 2 tokens per step under load'
          description: 'The draft model is predicting the target poorly; check the draft revision and serving settings.'
      - alert: WorkstationServingTimeToFirstTokenSlow
        expr: 'histogram_quantile(0.95, sum by (model_name, le) (rate(sglang:time_to_first_token_seconds_bucket{job="sglang"}[10m]))) > 20'
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'SGLang p95 time to first token above 20 seconds'
          description: 'Compare queue time with prefill; long-context prompts alone can exceed this.'
      - alert: WorkstationGatewayUnavailable
        expr: 'workstation_service_phase{job="gateway",phase="unavailable"} == 1'
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'The model gateway reports itself unavailable'
          description: 'Inspect the gateway boundary status and its SGLang upstream before clients retry.'
      # Assistant tools (service-tools /metrics, job assistant-tools). These
      # count tool outcomes only; a successful tool call is not task success.
      - record: workstation:assistant_retrieval_error_ratio:rate15m
        expr: 'sum by (job, instance) (rate(workstation_assistant_retrieval_requests_total{job="assistant-tools",outcome=~"error|unavailable"}[15m])) / sum by (job, instance) (rate(workstation_assistant_retrieval_requests_total{job="assistant-tools"}[15m]))'
      - alert: WorkstationAssistantRetrievalErrors
        expr: 'workstation:assistant_retrieval_error_ratio:rate15m > 0.2 and on(job, instance) sum by (job, instance) (increase(workstation_assistant_retrieval_requests_total{job="assistant-tools"}[15m])) >= 5'
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'More than 20% of retrieval tool calls failed over 15 minutes'
          description: 'Tool failures only; no_evidence and denied are not counted. Check the retrieval backend and reranker before trusting answers that cite project documents.'
      - alert: WorkstationAssistantRerankerNotActive
        expr: 'max by (job, instance, state) (workstation_assistant_reranker_state{job="assistant-tools",state=~"missing_assets|incompatible|unknown"}) == 1'
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'Retrieval is running without its configured reranker'
          description: 'Results are ranked by the first-stage score only. Restore the reranker assets or select a profile that disables it explicitly.'
      - alert: WorkstationAssistantHandoffConflicts
        expr: 'sum by (job, instance) (increase(workstation_assistant_handoff_operations_total{job="assistant-tools",op="save",outcome="conflict"}[30m])) > 5'
        labels: {severity: info}
        annotations:
          summary: 'Several task handoff saves were refused as stale (informational)'
          description: 'A conflict is the designed refusal of a save based on an older revision; nothing was overwritten. Repeated conflicts suggest two sessions writing the same task.'
      - alert: WorkstationAssistantServingContractIncomplete
        expr: 'max by (job, instance, contract) (workstation_assistant_serving_contract_info{job="assistant-tools",status="incomplete"}) == 1'
        for: 10m
        labels: {severity: info}
        annotations:
          summary: 'Assistant clients are rendered for an incomplete serving contract (informational)'
          description: 'The service render listed missing inputs in evidence.json; do not treat the assistant model route as qualified.'
